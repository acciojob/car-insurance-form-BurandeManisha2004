<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
<form method="post">
	<label for="name">Name:</label>
	<input id="name" type="text" required>
	<label for="email">Email:</label>
	<input id="email" type="email" required>
	<label >Gender:</label>
	<label for="male">Male</label>
	<input id="male" type="radio" name="gender" required>
		<label for="female">Female</label>
	<input id="female" type="radio" name="gender" required>
	<label for="cars">Cars Brands</label>
	<select id="cars">
		<option value="BMW">BMW</option>
		<option value="Audi">Audi</option>
	<option value="Mercedez">Marcedez</option>
	</select>
<label for="carage">Car Age:</label>
	<input id="carage" type="number" required>
<label for="dop">Date Of Purchase (dop) </label>
<input id="dop" type="date" required>
	<label for="password">Password:</label>
	<input type="password" id="password" required>
	<button type="submit">Submit</button>
</form>

</body>

</html>
